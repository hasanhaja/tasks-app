<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>Tasks | New task</title>
    <link href="main.css" rel="stylesheet">
    <!-- TODO placeholder favicon -->
    <link rel="icon" href="assets/ios/16.png" />

    <script type="module" src="main.js"></script>
  </head>
  <body class="container">
    <header>
      <h1 class="sr-only">New Task Page</h1>
    </header>

    <main>
      <h2 class="title">New task</h2>
      <form method="POST" action="/create">
        <label>
          <span>Task name</span>
          <textarea name="task" autofocus required class="input"></textarea>
        </label>
        <button type="submit" class="btn">Create</button>
      </form>
    </main>
  </body>
</html>
